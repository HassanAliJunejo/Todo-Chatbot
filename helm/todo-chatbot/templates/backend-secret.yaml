apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-backend-secret
  labels:
    {{- include "todo-chatbot.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  # IMPORTANT: These are placeholder values for development/testing only
  # In production, use external secret management solutions such as:
  # - Sealed Secrets (bitnami-labs/sealed-secrets)
  # - External Secrets Operator (external-secrets/external-secrets)
  # - HashiCorp Vault
  # - AWS Secrets Manager / Azure Key Vault / GCP Secret Manager
  #
  # Never commit real secrets to version control!
  DATABASE_URL: {{ .Values.backend.secrets.DATABASE_URL | quote }}
  COHERE_API_KEY: {{ .Values.backend.secrets.COHERE_API_KEY | quote }}
  JWT_SECRET: {{ .Values.backend.secrets.JWT_SECRET | quote }}
